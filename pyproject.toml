[project]
name = "offensive-security-engineering-lab"
version = "0.1.0"
description = "Educational offensive security software engineering lab with safe, local-only training scenarios."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
